backend:
  name: github
  repo: XAmple-Development/X-Ample-Website
  branch: tebex
  auth_endpoint: https://x-ampledevelopment.co.uk/.netlify/functions/oauth-begin

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog
    folder: content/blog
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: pages
    label: Pages
    files:
      - label: Home
        name: home
        file: content/pages/home.json
        format: json
        fields:
          - { name: kicker, label: Kicker, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: text }
          - label: Primary CTA
            name: primaryCta
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Href, widget: string }
          - label: Secondary CTA
            name: secondaryCta
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Href, widget: string }
          - label: Features
            name: features
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }

      - label: Portfolio
        name: portfolio
        file: content/pages/portfolio.json
        format: json
        fields:
          - { name: intro, label: Intro, widget: text }
          - label: Items
            name: items
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }

      - label: About
        name: about
        file: content/pages/about.json
        format: json
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: text }
          - { name: body, label: Body, widget: text }
          - label: Highlights
            name: highlights
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }

      - label: Team
        name: team
        file: content/pages/team.json
        format: json
        fields:
          - { name: intro, label: Intro, widget: text }
          - label: Members
            name: members
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: bio, label: Bio, widget: text }

