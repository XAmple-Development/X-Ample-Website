backend:
  name: github
  repo: XAmple-Development/X-Ample-Website
  branch: tebex
  # base_url + auth_endpoint (relative path only — do NOT use a full URL for auth_endpoint)
  base_url: https://x-ampledevelopment.co.uk
  auth_endpoint: auth

# Helps Decap resolve the CMS panel origin for OAuth postMessage
site_url: https://x-ampledevelopment.co.uk

media_folder: public/uploads
public_folder: /uploads

# Blog, team, and portfolio are managed in /admin (Supabase). Decap is for static page copy only.
collections:
  - name: pages
    label: Pages
    files:
      - label: Home
        name: home
        file: content/pages/home.json
        format: json
        fields:
          - { name: kicker, label: Kicker, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: text }
          - label: Primary CTA
            name: primaryCta
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Href, widget: string }
          - label: Secondary CTA
            name: secondaryCta
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Href, widget: string }
          - label: Features
            name: features
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }

      - label: About
        name: about
        file: content/pages/about.json
        format: json
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: text }
          - { name: body, label: Body, widget: text }
          - label: Highlights
            name: highlights
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
